<style>

  :root {
    --bg: #06033e;
    --card: #d9d9d9;
    --ink: #000000;
    --white: #ffffff;
    --green: #0b8d04;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }

  /* 402px-wide artboard from the Figma frames, scaled to fit the screen. */
  #stage {
    position: absolute; top: 0; left: 50%;
    width: 402px; height: 874px;
    transform-origin: top center;
    transform: translateX(-50%) scale(var(--s, 1));
  }
  .title {
    position: absolute; left: 0; right: 0; top: 25px; margin: 0; text-align: center;
    font: 32px/normal "Coral Pixels Plain", serif; color: var(--white);
    cursor: pointer; user-select: none;
  }
  .txt { margin: 0; font: 24px/normal "Pixelify Sans", sans-serif; color: var(--ink); text-align: center; }

  /* Grey card, centered; its height eases between screens. */
  #card {
    position: absolute; left: 53px; top: 335px; width: 296px; height: 159px;
    background: var(--card); border-radius: 60px; overflow: hidden;
    transition: height .55s var(--ease), transform .25s var(--ease);
  }
  #card.pulse { transform: scale(.97); }

  /* Screens fade and slide between each other inside the card. */
  .screen {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    opacity: 0; transform: translateY(14px); filter: blur(4px);
    transition: opacity .38s var(--ease), transform .45s var(--ease), filter .38s var(--ease);
  }
  .screen.active { opacity: 1; transform: none; filter: none; pointer-events: auto; transition-delay: .18s; }
  .screen.leaving { opacity: 0; transform: translateY(-14px); filter: blur(4px); transition-delay: 0s; }

  /* 1 — upload */
  #pick { position: absolute; inset: 0; cursor: pointer; }
  #pdfFile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* 2 — date (one step per date in the PDF) */
  .step { display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: opacity .25s var(--ease), transform .3s var(--ease); }
  .step.swap { opacity: 0; transform: translateX(-18px); transition-duration: .18s; }
  .step.enter { opacity: 0; transform: translateX(18px); transition: none; }
  .pill { width: 209px; height: 60px; background: var(--white); border-radius: 25px;
    display: flex; align-items: center; justify-content: center; }
  #date, #time {
    width: 100%; height: 100%; padding: 0; margin: 0; border: 0; outline: 0; background: transparent;
    border-radius: inherit; -webkit-appearance: none; appearance: none;
    color: var(--ink); text-align: center;
    font: 32px/normal "Pixelify Sans", sans-serif; caret-color: var(--ink);
  }
  #date::placeholder, #time::placeholder { color: var(--ink); opacity: .4; }
  #date::selection, #time::selection { background: var(--card); color: var(--ink); }
  .ampm { display: flex; gap: 12px; }
  .ampm button {
    width: 76px; height: 44px; border-radius: 22px; border: 1px solid transparent; padding: 0;
    background: var(--white); color: var(--ink); font: 24px/1 "Pixelify Sans", sans-serif; cursor: pointer;
    transition: background .2s var(--ease), border-color .2s, transform .15s var(--ease);
  }
  .ampm button.on { background: var(--green); border-color: var(--ink); }
  .ampm button:active { transform: scale(.94); }
  .pill.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* 3 — working: two-frame sprite walking back and forth */
  .walkway { position: relative; width: 216px; height: 92px; }
  .walker { position: absolute; left: 0; top: 0; width: 82.5px; height: 91.5px;
    animation: walk 2.6s ease-in-out infinite alternate; }

    image-rendering: pixelated;
    animation: frames .42s steps(2) infinite, bob .21s ease-in-out infinite alternate;
  }
  @keyframes frames { to { background-position: -165px 0; } }

  /* 4 — download: round button with a pixel arrow */

    width: 92px; height: 92px; border-radius: 50%; padding: 0;
    background: var(--green); border: 1px solid var(--ink); cursor: pointer;

    transition: transform .18s var(--ease), filter .15s;
  }

<body>
<div id="stage">
  <p class="title" id="home">DPP SERVICES</p>
  <div id="card">
    <section class="screen active" data-screen="upload" data-h="159">
      <div class="txt" id="uploadMsg"><p style="margin:0">manda o pdf porra</p><p style="margin:0">(toque aqui)</p></div>
      <label id="pick" for="pdfFile" aria-label="Escolher PDF"></label>
      <input type="file" id="pdfFile" accept="application/pdf">
    </section>

    <section class="screen" data-screen="date" data-h="216">
      <form class="step" id="dateForm" autocomplete="off">
        <p class="txt" id="dateLabel">escolha a data:</p>
        <div class="pill" id="pill">
          <input id="date" type="text" inputmode="numeric" enterkeyhint="go"
                 placeholder="12/09/2026" aria-labelledby="dateLabel">
        </div>
      </form>
    </section>

    <section class="screen" data-screen="time" data-h="272">
      <form class="step" id="timeForm" autocomplete="off">
        <p class="txt" id="timeLabel">escolha o horário:</p>
        <div class="pill" id="tpill">
          <input id="time" type="text" inputmode="numeric" enterkeyhint="go"
                 placeholder="04:25" aria-labelledby="timeLabel">
        </div>
        <div class="ampm" role="group" aria-label="AM ou PM">
          <button type="button" data-ap="AM">AM</button>
          <button type="button" data-ap="PM">PM</button>
        </div>
      </form>
    </section>

    <section class="screen" data-screen="work" data-h="216" aria-live="polite">
      <p class="txt">trabalhando ....</p>
      <div class="walkway"><div class="walker"><i></i></div></div>
    </section>

    <section class="screen" data-screen="done" data-h="216">
      <button id="dl" type="button" aria-label="Baixar PDF">
        <svg viewBox="0 0 10 10" aria-hidden="true" fill="#000">
          <rect x="4" y="0" width="2" height="5"/><rect x="2" y="4" width="6" height="1"/>
          <rect x="3" y="5" width="4" height="1"/><rect x="4" y="6" width="2" height="1"/>
          <rect x="1" y="8" width="8" height="2"/>
        </svg>
      </button>
      <p class="txt">download :)</p>
    </section>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const WALK_MIN_MS = 3200; // the walker stays on screen at least this long

/* ---------- layout ---------- */
// Scale to the screen. The on-screen keyboard only shrinks the height, so height
// changes are ignored unless the width really changed (e.g. rotating the phone).
let fitW = 0, fitH = 0;
function fit() {
  if (Math.abs(innerWidth - fitW) > 40) { fitW = innerWidth; fitH = innerHeight; }
  else fitH = Math.max(fitH, innerHeight);
  const s = Math.min(fitW / 402, fitH / 620);
  $("stage").style.setProperty("--s", s);
}
addEventListener("resize", fit); fit();

/* ---------- screen transitions ---------- */
let current = "upload";
function show(name) {
  if (name === current) return;
  const from = document.querySelector(`[data-screen="${current}"]`);
  const to = document.querySelector(`[data-screen="${name}"]`);
  from.classList.remove("active"); from.classList.add("leaving");
  setTimeout(() => from.classList.remove("leaving"), 450);
  to.classList.add("active");
  $("card").style.height = to.dataset.h + "px";
  current = name;
}
function pulse() {
  const c = $("card"); c.classList.add("pulse");
  setTimeout(() => c.classList.remove("pulse"), 160);
}

/* ---------- finding dates and times ---------- */
const MONTHS = ["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
const ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DATE_RE = (() => {
  const words = [];
  for (const m of [...MONTHS, ...ABBR, "Sept"]) words.push(m, m.toUpperCase());
  const uniq = [...new Set(words)].sort((a, b) => b.length - a.length);
  return new RegExp(
    "(?<![A-Za-z])(" + uniq.join("|") + ")(?![A-Za-z])" +
    "(?:([ \\-./]+)(\\d{1,2}(?:st|nd|rd|th)?)(?![\\dA-Za-z])" +
    "(?:(,? ?[ \\-./]?|, ?)(\\d{4}|\\d{2})(?!\\d))?" +
    "|(,? +)(\\d{4})(?!\\d))?", "g");
})();
// "04:25 PM", "4:25pm"
const TIME_RE = /(?<![\d:])(\d{1,2}):(\d{2})(\s?)(AM|PM|am|pm)(?![A-Za-z])/g;

function classify(word) {
  const w = word.toLowerCase();
  let idx = MONTHS.findIndex(m => m.toLowerCase() === w);
  if (idx >= 0) return { idx, full: true };
  if (w === "sept") return { idx: 8, full: false };
  return { idx: ABBR.findIndex(m => m.toLowerCase() === w), full: false };
}
function ordinal(n) {
  if (n % 100 >= 11 && n % 100 <= 13) return "th";
  return ["th", "st", "nd", "rd"][n % 10] || "th";
}
const pad = n => String(n).padStart(2, "0");

function dateText(m, t) {
  let month = m.full ? MONTHS[t.month] : ABBR[t.month];
  if (m.word.length > 1 && m.word === m.word.toUpperCase()) month = month.toUpperCase();
  if (m.dayStr == null && m.yearStr != null) return month + m.sep2 + t.year;
  if (m.dayStr == null) return month;
  const digits = m.dayStr.match(/^\d+/)[0];
  let d = String(t.day);
  const padded = digits.startsWith("0") || (digits.length === 2 && /[-./]/.test(m.sep1));
  if (padded && d.length === 1) d = "0" + d;
  if (m.dayStr.length > digits.length) d += ordinal(t.day);
  let out = month + m.sep1 + d;
  if (m.yearStr != null) out += m.sep2 + (m.yearStr.length === 2 ? pad(t.year % 100) : t.year);
  return out;
}
function timeText(m, t) {
  const h = m.hStr.length === 2 ? pad(t.h) : String(t.h);
  const ap = m.ap === m.ap.toLowerCase() ? t.ap.toLowerCase() : t.ap;
  return `${h}:${pad(t.m)}${m.sp}${ap}`;
}

// items: text pieces with something to change.
// steps: one question per distinct date, then one per distinct time, in document order.
const state = { bytes: null, name: "", items: [], steps: [], step: 0, out: null };

async function scan(bytes) {
  const items = [];
  const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    for (const it of tc.items) {
      if (!it.str) continue;
      const found = [];
      let r;
      DATE_RE.lastIndex = 0;
      while ((r = DATE_RE.exec(it.str))) {
        const c = classify(r[1]);
        const m = { kind: "date", word: r[1], start: r.index, end: r.index + r[0].length, ...c,
          sep1: r[2] ?? "", dayStr: r[3] ?? null, sep2: r[4] ?? r[6] ?? "", yearStr: r[5] ?? r[7] ?? null };
        // A lone "May" is the verb ("To Whom It May Concern"), not a date.
        m.on = !(m.idx === 4 && m.dayStr == null && m.yearStr == null);
        found.push(m);
      }
      TIME_RE.lastIndex = 0;
      while ((r = TIME_RE.exec(it.str))) {
        const h = +r[1], mi = +r[2];
        if (h < 1 || h > 12 || mi > 59) continue;
        found.push({ kind: "time", start: r.index, end: r.index + r[0].length, on: true,
          hStr: r[1], h, m: mi, sp: r[3], ap: r[4] });
      }
      found.sort((a, b) => a.start - b.start);
      if (found.some(m => m.on)) items.push({ page: p - 1, str: it.str, transform: it.transform, width: it.width, matches: found });
    }
  }
  return items;
}

// The same date written twice ("September 23, 2026" and "Sep-23-26") is asked only once.
function buildSteps(items) {
  const all = items.flatMap(i => i.matches).filter(m => m.on);
  const dates = [], times = [], byKey = new Map(), loose = [];
  for (const m of all) {
    if (m.kind === "time") {
      const key = `t${m.h}:${m.m}${m.ap.toUpperCase()}`;
      let g = byKey.get(key);
      if (!g) { g = { type: "time", h: m.h, m: m.m, ap: m.ap.toUpperCase(), matches: [], target: null }; byKey.set(key, g); times.push(g); }
      g.matches.push(m); continue;
    }
    if (m.dayStr == null) { loose.push(m); continue; }
    const day = parseInt(m.dayStr, 10);
    const year = m.yearStr == null ? null : (m.yearStr.length === 2 ? 2000 + +m.yearStr : +m.yearStr);
    const key = `d${m.idx}-${day}-${year ?? ""}`;
    let g = byKey.get(key);
    if (!g) { g = { type: "date", month: m.idx, day, year, matches: [], target: null }; byKey.set(key, g); dates.push(g); }
    g.matches.push(m);
  }
  // Month with no day ("October 2026"): follows the first date.
  if (loose.length) {
    if (!dates.length) dates.push({ type: "date", month: loose[0].idx, day: 1, year: null, matches: [], target: null });
    dates[0].matches.push(...loose);
  }
  return [...dates, ...times];
}

async function buildPdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(state.bytes.slice());
  const regular = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const pages = doc.getPages();
  const stepOf = new Map();
  for (const g of state.steps) for (const m of g.matches) stepOf.set(m, g);
  const textFor = m => {
    const g = stepOf.get(m);
    return m.kind === "time" ? timeText(m, g.target) : dateText(m, g.target);
  };

  for (const item of state.items) {
    const sel = item.matches.filter(m => m.on);
    const [a, b, c, d, x0, y0] = item.transform;
    if (Math.abs(b) > 0.001 || Math.abs(c) > 0.001) continue;
    const size = Math.abs(d);
    // Full month name -> bold; everything else (abbreviated dates, times) -> regular.
    const font = sel.some(m => m.kind === "date" && m.full) ? bold : regular;
    let newStr = "", pos = 0;
    for (const m of item.matches) {
      newStr += item.str.slice(pos, m.start) + (m.on ? textFor(m) : item.str.slice(m.start, m.end));
      pos = m.end;
    }
    newStr += item.str.slice(pos);
    const natural = font.widthOfTextAtSize(item.str, size);
    const k = natural > 0 && item.width > 0 ? item.width / natural : 1;
    const startChar = sel[0].start;
    const startX = x0 + font.widthOfTextAtSize(item.str.slice(0, startChar), size) * k;
    const page = pages[item.page];
    page.drawRectangle({ x: startX - size * 0.04, y: y0 - size * 0.24,
      width: x0 + item.width - startX + size * 0.08, height: size * 1.2, color: rgb(1, 1, 1) });
    let x = startX;
    for (const ch of newStr.slice(startChar)) {
      page.drawText(ch, { x, y: y0, size, font, color: rgb(0, 0, 0) });
      x += font.widthOfTextAtSize(ch, size) * k;
    }
  }
  return doc.save();
}

/* ---------- flow ---------- */
const DEFAULT_MSG = ["manda o pdf porra", "(toque aqui)"];
function setUploadMsg([a, b]) {
  $("uploadMsg").children[0].textContent = a;
  $("uploadMsg").children[1].textContent = b;
}

$("pdfFile").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  pulse();
  setUploadMsg(["lendo...", ""]);
  try {
    state.name = f.name.replace(/\.pdf$/i, "");
    state.bytes = new Uint8Array(await f.arrayBuffer());
    state.items = await scan(state.bytes);
    state.steps = buildSteps(state.items);
  } catch {
    setUploadMsg(["esse pdf deu ruim", "(toque aqui)"]); return;
  }
  if (!state.steps.length) { setUploadMsg(["nao achei data nesse pdf", "(toque aqui)"]); return; }
  setUploadMsg(DEFAULT_MSG);
  state.step = 0;
  fillStep();
  show(state.steps[0].type);
  setTimeout(() => focusField(), 450);
});

const fieldOf = type => $(type === "time" ? "time" : "date");
function focusField() { fieldOf(state.steps[state.step].type).focus({ preventScroll: true }); }

function fillStep() {
  const g = state.steps[state.step];
  if (g.type === "date") {
    const n = state.steps.filter(s => s.type === "date").length;
    const i = state.steps.indexOf(g);
    $("dateLabel").textContent = n === 1 ? "escolha a data:" : i === 0 ? "escolha a 1ª data:" : `agora a ${i + 1}ª data:`;
    $("date").placeholder = g.year != null ? `${pad(g.day)}/${pad(g.month + 1)}/${g.year}` : "12/09/2026";
    $("date").value = "";
  } else {
    const times = state.steps.filter(s => s.type === "time");
    const i = times.indexOf(g);
    $("timeLabel").textContent = times.length === 1 ? "escolha o horário:" : `escolha o ${i + 1}º horário:`;
    $("time").placeholder = `${pad(g.h)}:${pad(g.m)}`;
    $("time").value = "";
    setAmPm(g.ap);
  }
}

let ampm = "PM";
function setAmPm(v) {
  ampm = v;
  document.querySelectorAll(".ampm button").forEach(b => b.classList.toggle("on", b.dataset.ap === v));
}

function parseDate(v) {
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  const day = +m[1], month = +m[2] - 1, year = +m[3];
  const dt = new Date(year, month, day);
  if (dt.getFullYear() !== year || dt.getMonth() !== month || dt.getDate() !== day) return null;
  return { day, month, year };
}
function parseTime(v) {
  const m = v.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  return h >= 1 && h <= 12 && mi <= 59 ? { h, m: mi } : null;
}

// Masks: digits only, separators added automatically.
$("date").addEventListener("input", e => {
  const digits = e.target.value.replace(/\D/g, "").slice(0, 8);
  let v = digits.slice(0, 2);
  if (digits.length > 2) v += "/" + digits.slice(2, 4);
  if (digits.length > 4) v += "/" + digits.slice(4);
  e.target.value = v;
  if (digits.length === 8 && e.inputType !== "deleteContentBackward") submitStep();
});
$("time").addEventListener("input", e => {
  const digits = e.target.value.replace(/\D/g, "").slice(0, 4);
  e.target.value = digits.length > 2 ? digits.slice(0, 2) + ":" + digits.slice(2) : digits;
});
$("dateForm").addEventListener("submit", e => { e.preventDefault(); submitStep(); });
$("timeForm").addEventListener("submit", e => { e.preventDefault(); submitStep(); });
// Tapping AM or PM picks it and confirms the time.
document.querySelectorAll(".ampm button").forEach(b =>
  b.addEventListener("click", () => { setAmPm(b.dataset.ap); submitStep(); }));

function shake(id) {
  const p = $(id); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
}

let busy = false;
async function submitStep() {
  if (busy) return;
  const g = state.steps[state.step];
  if (g.type === "date") {
    const input = $("date");
    const t = parseDate(input.value || (g.year != null ? input.placeholder : ""));
    if (!t) return shake("pill");
    g.target = t;
  } else {
    const t = parseTime($("time").value || $("time").placeholder);
    if (!t) return shake("tpill");
    g.target = { ...t, ap: ampm };
  }

  const next = state.steps[state.step + 1];
  if (next) {
    busy = true;
    if (next.type === g.type) {
      // Same kind of question: slide to the next one.
      const form = $(g.type === "time" ? "timeForm" : "dateForm");
      form.classList.add("swap");
      await sleep(190);
      state.step++; fillStep();
      form.classList.remove("swap"); form.classList.add("enter");
      void form.offsetWidth;
      form.classList.remove("enter");
    } else {
      state.step++; fillStep();
      show(next.type);
      await sleep(300);
    }
    focusField();
    busy = false;
    return;
  }

  busy = true;
  document.activeElement?.blur();
  show("work");
  const started = Date.now();
  try {
    state.out = await buildPdf();
    await sleep(Math.max(0, WALK_MIN_MS - (Date.now() - started)));
    show("done");
  } catch {
    setUploadMsg(["deu erro, tenta de novo", "(toque aqui)"]);
    show("upload");
  } finally { busy = false; }
}

function reset() {
  state.bytes = null; state.items = []; state.steps = []; state.out = null; state.step = 0;
  setUploadMsg(DEFAULT_MSG);
  show("upload");
}

$("dl").addEventListener("click", () => {
  if (!state.out) return;
  const url = URL.createObjectURL(new Blob([state.out], { type: "application/pdf" }));
  const a = document.createElement("a");
  a.href = url; a.download = state.name + "-editado.pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  setTimeout(reset, 700);
});

// Tapping the title starts over.
$("home").addEventListener("click", () => { if (!busy) reset(); });
</script>
</body>
